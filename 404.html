<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      This portfolio has moved to akshaykumarbm.tech.

      GitHub Pages cannot issue a real 301, so this is the closest equivalent:
      a zero-delay meta refresh plus rel="canonical", which search engines and
      AI crawlers treat as a redirect and which consolidates this URL's
      authority onto the new domain instead of splitting it across two sites.
    -->
    <title>Akshay Kumar BM — moved to akshaykumarbm.tech</title>
    <link rel="canonical" href="https://www.akshaykumarbm.tech/" />
    <meta http-equiv="refresh" content="0; url=https://www.akshaykumarbm.tech/" />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="Akshay Kumar BM builds production AI agents for engineering and IT operations. This site has moved to akshaykumarbm.tech."
    />

    <style>
      :root {
        color-scheme: light;
        --paper: #faf7f0;
        --ink: #1a1d1a;
        --muted: #5a625a;
        --emerald: #0f4d3a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter Tight", Inter, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
      }
      main { max-width: 34rem; text-align: center; }
      .label {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 1.25rem;
      }
      h1 {
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(1.9rem, 6vw, 2.75rem);
        line-height: 1.1;
        margin: 0 0 1rem;
      }
      p { color: var(--muted); margin: 0 0 2rem; }
      a.cta {
        display: inline-block;
        padding: 0.85rem 1.6rem;
        background: var(--emerald);
        color: var(--paper);
        text-decoration: none;
        font-size: 0.95rem;
      }
      a.cta:hover { opacity: 0.9; }
      .fallback { margin-top: 2rem; font-size: 0.85rem; }
      .fallback a { color: var(--emerald); }
    </style>
  </head>
  <body>
    <main>
      <p class="label">This site has moved</p>
      <h1>Akshay Kumar BM</h1>
      <p>
        Production AI agents for engineering and IT operations. Everything now
        lives at akshaykumarbm.tech.
      </p>
      <a class="cta" href="https://www.akshaykumarbm.tech/">Go to akshaykumarbm.tech</a>
      <p class="fallback">
        Not redirected automatically?
        <a href="https://www.akshaykumarbm.tech/">Follow this link</a>.
      </p>
    </main>

    <script>
      // replace() rather than assign() so the old URL does not linger in
      // browser history and bounce people back here on "back".
      location.replace("https://www.akshaykumarbm.tech/");
    </script>
  </body>
</html>
